<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080913">
    <title>折相域</title>
    <link rel="stylesheet" href="styles.css?v=phase04">
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i>
        </div>
        <nav id="map" class="map" aria-label="地图"></nav>
        <button id="resetRun" class="icon-button reset-button" aria-label="重新开始">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M13 14a16 16 0 1 1-3 17"/>
            <path d="M7 10l7 4-4 7"/>
          </svg>
        </button>
      </header>

      <section class="stage" aria-label="折相场">
        <aside class="target-panel" aria-label="目标形态">
          <canvas id="targetCanvas"></canvas>
        </aside>
        <canvas id="fieldCanvas" aria-label="可交互色场"></canvas>
        <aside class="pulse-panel" aria-label="全局相位">
          <canvas id="pulseCanvas"></canvas>
        </aside>
        <div id="outcome" class="outcome" hidden>
          <button id="outcomeAction" class="outcome-action" aria-label="继续">
            <svg class="portal-symbol" viewBox="0 0 120 120" aria-hidden="true">
              <path d="M60 12 101 36 101 84 60 108 19 84 19 36Z"/>
              <path d="M60 29 86 44 86 76 60 91 34 76 34 44Z"/>
              <circle cx="60" cy="60" r="12"/>
            </svg>
            <svg class="fracture-symbol" viewBox="0 0 120 120" aria-hidden="true">
              <path d="M22 23 51 51 43 77 63 105"/>
              <path d="M96 18 69 46 77 65 52 91"/>
              <path d="M13 72 43 64 57 41 79 24"/>
              <path d="M107 83 78 70 65 81 38 99"/>
            </svg>
          </button>
        </div>
      </section>

      <section id="actions" class="actions" aria-label="操作"></section>
    </main>

    <script src="engine.js"></script>
    <script src="app.js?v=phase04"></script>
  </body>
</html>
