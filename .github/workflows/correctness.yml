name: correctness
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      STS_LIGHTSPEED_BUILD_DIR: ${{ github.workspace }}/sim/sts_lightspeed/build-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install uv==0.11.8
          uv sync --locked --extra cpu --group test --no-dev --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build current native extension (rule fixtures enabled)
        run: |
          cmake -S sim/sts_lightspeed -B "$STS_LIGHTSPEED_BUILD_DIR" -G Ninja -DPYBIND11_FINDPYTHON=ON -DPython_EXECUTABLE="$(which python)" -DSTS_ENABLE_RULE_TRACE=ON
          cmake --build "$STS_LIGHTSPEED_BUILD_DIR" --target slaythespire --parallel 2
          python -c "from env.core import _BUILD; import slaythespire; print(_BUILD, slaythespire.__file__); assert hasattr(slaythespire.BattleContext, 'nosl_neural_search_begin')"
      - name: Existing and new correctness contracts
        run: python -m pytest -q -m "not training" --junitxml=runs/local/contracts.xml
      - name: Module syntax and launcher syntax (without launching experiments)
        run: |
          python -m compileall -q rl env tools apps configs tests bridge
          for script in experiments/launchers/*.sh tools/operations/*.sh; do
            bash -n "$script"
          done
      - name: Real training, optimizer persistence and CPU bitwise checks
        run: python -m pytest -q -m training --junitxml=runs/local/training.xml
      - name: Bounded performance smoke (no hardware-specific speed gate)
        run: python -m rl.benchmarks.train --device cpu --output runs/local/ci-benchmark.json --timeout 180
      - name: Whitespace checks
        run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-correctness-evidence
          path: runs/local/
          if-no-files-found: warn
