[project]
name = "sts-rl"
version = "0.0.0"
# Local native builds use 3.11; the existing remote image uses 3.12.
# Native extensions must still be compiled for the selected interpreter.
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.12.0 ; sys_platform != 'darwin'",
    "torch>=2.1 ; sys_platform == 'darwin'",
    "gymnasium==1.0.0",
    "numpy==2.4.6",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
    "psutil==7.2.2",
]

# One dependency declaration and lock, with explicit wheel selection.
[project.optional-dependencies]
cpu = ["torch"]
cuda = ["torch"]

[dependency-groups]
dev = [
    "plotly>=6.9.0",
    "tensorboard>=2.21.0",
    "wandb>=0.28.1",
]
test = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    # Bundled nlohmann/json declares CMake 3.1 policies, removed by CMake 4.
    "cmake>=3.19,<4",
    "ninja",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu132", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
